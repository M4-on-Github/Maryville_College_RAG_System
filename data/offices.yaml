# Task 8 step 4 -- silo -> office -> contact -> referral destination.
#
# Decision 0002: this table is small, hand-checked, and reviewable in a
# sitting. Every non-`other` silo in silos.yaml MUST have a row here (asserted
# by tests). `destination_url` is the one page a person should land on for a
# referral -- it is never quoted from and never treated as a citation
# (decision 0002); it may point at a page we hold no chunk for.
#
# Source column values:
#   division-office-block  -- /directories/department/'s own structured
#                              office listing (scripts/match_offices.py),
#                              confidence: high
#   heuristic + human review -- scripts/match_offices.py's candidate search,
#                              corrected by hand (data/office_candidates.csv)
#   manual corpus search    -- found by grepping the extracted corpus for a
#                              known office's contact after the heuristic's
#                              top-5-shortest-page search missed it
#
# See decisions/0003-silo-taxonomy.md for the judgment call behind every
# non-"high" row.


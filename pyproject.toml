[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrag"
version = "0.1.0"
description = "Cross-silo RAG over maryvillecollege.edu and its SmartCatalogIQ catalog"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "trafilatura>=1.8",
    "lxml>=5.0",
    # Task 23: the stream contract's models, and Task 25's FastAPI shell
    # after it -- one dependency, not two, since FastAPI is built on it.
    "pydantic>=2.0",
]

[project.optional-dependencies]
index = ["lancedb>=0.6", "sentence-transformers>=2.7", "rank-bm25>=0.2.2"]
# sentencepiece: DeBERTa-v2/v3 tokenizers (Task 19 NLI faithfulness, Task 18
# cross-encoder reranker) require it; not pulled in by sentence-transformers
# itself. brotli: huggingface_hub's httpx-based downloader silently corrupts
# a brotli-compressed model file without it (brotlicffi alone reproduces a
# "Cannot find the requested files" / "Unrecognized processing class" error
# that looks like a real model incompatibility but isn't -- Task 19 hit this).
scoring = ["sentencepiece>=0.2", "brotli>=1.1"]
analysis = ["matplotlib>=3.8"]  # Task 21's tradeoff curves
# Task 25: the API shell itself. Optional -- `mcrag.service.answer` (Task 24)
# stays importable and callable with nothing here installed.
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# httpx: fastapi.testclient.TestClient's transport (Task 25's tests/test_api.py).
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["mcrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

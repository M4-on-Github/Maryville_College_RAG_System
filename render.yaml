services:
  - type: web
    name: maryville-college-rag
    runtime: docker
    # Free (512 MB). The Dockerfile runs int8 ONNX models, one at a time, but
    # measured peak is ~480-510 MB: expect an occasional out-of-memory restart.
    # Dockerfile.torch needs ~2 GB (a paid plan).
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OLLAMA_API_KEY
        sync: false          # set in the Render dashboard, never in this file
      - key: MCRAG_RATE_PER_MIN
        value: "6"
      - key: MCRAG_DAILY_CAP
        value: "300"
